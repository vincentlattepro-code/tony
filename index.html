<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03070a">
  <meta name="description" content="Dina — assistant domestique Live2D">
  <link rel="manifest" href="manifest.json">
  <title>Dina</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070a}
    #app{position:relative;width:100vw;height:100vh;overflow:hidden;background:
      radial-gradient(circle at 50% 38%,rgba(21,115,143,.18),transparent 34%),
      linear-gradient(180deg,#071016 0%,#020609 100%)}
    #live2d{position:absolute;inset:0;width:100%;height:100%;z-index:2}
    .grid{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(97,232,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(97,232,255,.25) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,transparent 0%,#000 28%,#000 80%,transparent 100%)}
    .hud{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.12),transparent 24%,transparent 72%,rgba(0,0,0,.44))}
  </style>
</head>
<body>
  <div id="app">
    <div class="grid"></div>
    <canvas id="live2d"></canvas>
    <div class="hud"></div>
    <audio id="voice" preload="auto" src="assets/dina/sounds/dina_kokoro.wav"></audio>
  </div>

  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
  <script src="app.js?v=20260902-2"></script>
</body>
</html>
